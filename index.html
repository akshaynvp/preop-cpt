<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-op CPT Tool</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap');
:root{
  --bg:#f4f3ef;--bg2:#eceae4;--border:#d0cec4;
  --text:#1a1917;--text2:#5a5850;--text3:#8a8880;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--radius:6px;
  --ok-bg:#d6ede0;--ok-fg:#1a4d2e;--unc-bg:#fdf0d5;--unc-fg:#7a4f00;
  --no-bg:#fce8e8;--no-fg:#7a1f1f;--lit-bg:#dde8fc;--lit-fg:#1a3a7a;
  --unk-bg:#ebebeb;--unk-fg:#555;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
.page{max-width:720px;margin:0 auto;padding:2rem 1.5rem 4rem;}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);}
.masthead h1{font-size:16px;font-weight:600;letter-spacing:-0.01em;}
.masthead p{font-size:12px;color:var(--text3);margin-top:3px;font-family:var(--mono);}
.mtag{font-family:var(--mono);font-size:10px;font-weight:500;background:var(--text);color:var(--bg);padding:3px 8px;border-radius:3px;letter-spacing:0.04em;white-space:nowrap;margin-top:2px;}
.fg{margin-bottom:1.5rem;}
.fgt{font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);}
.fr{display:flex;gap:12px;margin-bottom:.75rem;align-items:flex-start;}
.f{flex:1;}
.f.w140{flex:0 0 140px;}
.f label{display:block;font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.f label .req{color:#c0392b;}
input[type=number],select{width:100%;padding:8px 10px;font-size:13px;font-family:var(--sans);border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);outline:none;transition:border-color .12s;}
input:focus,select:focus{border-color:var(--text);}
.iu{display:flex;align-items:center;gap:8px;}
.iu span{font-family:var(--mono);font-size:12px;color:var(--text3);}
.diag-tag,.loc-tag{display:none;margin-top:5px;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;border:1px solid;}
.calc-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--text2);margin-bottom:1rem;display:none;}
.calc-box.show{display:block;}
.calc-box strong{color:var(--text);}
.err-box{background:var(--no-bg);border:1px solid #e5a0a0;border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--no-fg);margin-bottom:.75rem;display:none;line-height:1.5;}
.go-btn{width:100%;padding:10px 20px;font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.03em;background:var(--text);color:var(--bg);border:1px solid var(--text);border-radius:var(--radius);cursor:pointer;transition:opacity .12s;}
.go-btn:hover{opacity:.85;}
.hint{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:center;margin-top:8px;}
.rh{display:flex;justify-content:space-between;align-items:baseline;margin:2rem 0 1rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);}
.rh span{font-size:15px;font-weight:600;}
.new-btn{font-family:var(--mono);font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;text-decoration:underline;}
.new-btn:hover{color:var(--text);}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.75rem;overflow:hidden;}
.ch{padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);}
.cb{padding:14px;}
.cg{font-family:var(--mono);font-size:12.5px;line-height:2;}
.cr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.cl{color:var(--text2);min-width:230px;font-size:11.5px;}
.cv{font-weight:500;color:var(--text);}
.su{font-size:11px;color:var(--text3);margin-left:4px;}
.cdiv{border:none;border-top:1px solid var(--border);margin:6px 0;}
.sdiv{border:none;border-top:1px solid var(--border);margin:12px 0;}
.sl2{font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;}
.leg{width:100%;border-collapse:collapse;font-size:12px;}
.leg td{padding:4px 0;vertical-align:top;}
.leg td:first-child{font-family:var(--mono);color:var(--text2);width:90px;white-space:nowrap;}
.nt{font-size:11px;color:var(--text3);font-style:italic;margin-top:8px;}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:3px;font-family:var(--mono);font-size:12px;font-weight:500;margin-bottom:8px;letter-spacing:.02em;}
.b-ok{background:var(--ok-bg);color:var(--ok-fg);}
.b-unc{background:var(--unc-bg);color:var(--unc-fg);}
.b-no{background:var(--no-bg);color:var(--no-fg);}
.b-lit{background:var(--lit-bg);color:var(--lit-fg);}
.b-unk{background:var(--unk-bg);color:var(--unk-fg);}
.mn{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5;}
.ma{font-size:12px;color:var(--text);font-style:italic;margin-top:4px;}
.ml2{font-size:12px;color:var(--text3);margin-top:6px;font-family:var(--mono);}
.lb{font-size:11.5px;color:var(--lit-fg);background:var(--lit-bg);border-radius:var(--radius);padding:7px 10px;margin-top:8px;border:1px solid #b3c8f5;line-height:1.5;}
.slnb{font-size:12px;padding:8px 10px;border-radius:var(--radius);border:1px solid;margin-top:10px;line-height:1.5;}
.sl-req{background:var(--unc-bg);color:var(--unc-fg);border-color:#f0d070;}
.sl-con{background:var(--lit-bg);color:var(--lit-fg);border-color:#b3c8f5;}
.sl-ni{background:var(--bg2);color:var(--text2);border-color:var(--border);}
.sl-t{font-weight:600;margin-bottom:3px;}
.sl-s{margin-top:4px;font-size:11px;opacity:.75;font-style:italic;}
.mr2{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
.mla{font-family:var(--mono);font-size:11.5px;color:var(--text2);min-width:190px;}
.mv{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--text);}
.fl{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;margin-left:6px;font-weight:500;letter-spacing:.03em;}
.fl-ok{background:var(--ok-bg);color:var(--ok-fg);}
.fl-low{background:var(--no-bg);color:var(--no-fg);}
.fl-inf{background:var(--unc-bg);color:var(--unc-fg);}
.mno{font-size:11.5px;color:var(--text2);margin-top:5px;line-height:1.55;}
.msr{font-size:11px;color:var(--text3);font-style:italic;margin-top:3px;}
</style>
</head>
<body>
<div class="page">
<div class="masthead">
  <div>
    <h1>Pre-op CPT Tool</h1>
    <p>Dermatology &middot; Mohs AUC &middot; Margin guidance &middot; SLNB prompts</p>
  </div>
  <div class="mtag">CLINICAL TOOL</div>
</div>

<div id="form-section">

<!-- DIAGNOSIS -->
<div class="fg">
  <div class="fgt">Diagnosis</div>
  <div class="fr">
    <div class="f">
      <label for="diagnosis">Diagnosis <span class="req">*</span></label>
      <select id="diagnosis">
        <option value="">&#8212; select diagnosis &#8212;</option>
        <optgroup label="Basal Cell Carcinoma">
          <option value="BCC|bcc_superficial">BCC &#8212; superficial</option>
          <option value="BCC|bcc_nodular">BCC &#8212; nodular</option>
          <option value="BCC|bcc_aggressive">BCC &#8212; aggressive (morpheaform / infiltrative / micronodular)</option>
        </optgroup>
        <optgroup label="Squamous Cell Carcinoma">
          <option value="SCC|scc_nonaggressive">SCC &#8212; nonaggressive</option>
          <option value="SCC|scc_aggressive">SCC &#8212; aggressive</option>
          <option value="SCC|scc_verrucous">SCC &#8212; verrucous</option>
          <option value="SCC|scc_katype">SCC &#8212; KA-type</option>
          <option value="SCC|scc_sccis_bowen">SCCIS / Bowen disease</option>
          <option value="SCC|scc_ak_focal_sccis">AK with focal SCCIS</option>
        </optgroup>
        <optgroup label="Melanocytic">
          <option value="LM_MIS|mis">Melanoma in situ &#8212; non-LM (MIS)</option>
          <option value="LM_MIS|lm">Lentigo maligna (LM)</option>
          <option value="MELANOMA_INV|">Invasive melanoma</option>
        </optgroup>
        <optgroup label="Other Malignant &#8212; Mohs literature-supported">
          <option value="DFSP|">DFSP (Dermatofibrosarcoma protuberans)</option>
          <option value="MCC|">MCC (Merkel cell carcinoma)</option>
          <option value="MAC|">MAC (Microcystic adnexal carcinoma)</option>
          <option value="SEBACEOUS_CA|">Sebaceous carcinoma</option>
          <option value="EMPD|">EMPD (Extramammary Paget disease)</option>
          <option value="AFX|">AFX (Atypical fibroxanthoma)</option>
          <option value="LEIOMYOSARCOMA|">Leiomyosarcoma (cutaneous)</option>
          <option value="KERATOACANTHOMA|">Keratoacanthoma</option>
          <option value="SPINDLE_CELL|">Spindle cell tumor (cutaneous)</option>
          <option value="ECCRINE_APOCRINE|">Eccrine / apocrine carcinoma</option>
          <option value="TRICHILEMMAL|">Trichilemmal carcinoma</option>
          <option value="MUCINOUS_CA|">Mucinous carcinoma (primary cutaneous)</option>
          <option value="OTHER_MAL|">Other malignant</option>
        </optgroup>
        <optgroup label="Benign">
          <option value="BENIGN|cyst">Cyst (epidermoid / pilar)</option>
          <option value="BENIGN|lipoma">Lipoma</option>
          <option value="BENIGN|df">Dermatofibroma</option>
          <option value="BENIGN|nevus">Nevus</option>
          <option value="BENIGN|sk">Seborrheic keratosis</option>
          <option value="OTHER_BENIGN|">Other benign</option>
        </optgroup>
      </select>
      <div class="diag-tag" id="diag-tag"></div>
    </div>
  </div>
  <div class="fr">
    <div class="f w140">
      <label for="pr">Primary or recurrent</label>
      <select id="pr">
        <option value="primary" selected>Primary</option>
        <option value="recurrent">Recurrent</option>
      </select>
    </div>
    <div class="f w140">
      <label for="ic">Immunocompromised?</label>
      <select id="ic">
        <option value="no" selected>No</option>
        <option value="yes">Yes</option>
      </select>
    </div>
  </div>
</div>

<!-- LOCATION -->
<div class="fg">
  <div class="fgt">Location</div>
  <div class="fr">
    <div class="f">
      <label for="location">Lesion location <span class="req">*</span></label>
      <select id="location">
        <option value="">&#8212; select location &#8212;</option>
        <optgroup label="Head &#8212; Scalp">
          <option value="M|scalp|scalp_vertex|scalp">Scalp &#8212; vertex (Area M)</option>
          <option value="M|scalp|scalp_frontal|scalp">Scalp &#8212; frontal (Area M)</option>
          <option value="M|scalp|scalp_parietal|scalp">Scalp &#8212; parietal (Area M)</option>
          <option value="M|scalp|scalp_occipital|scalp">Scalp &#8212; occipital (Area M)</option>
          <option value="M|scalp|scalp_temporal|scalp">Scalp &#8212; temporal (Area M)</option>
        </optgroup>
        <optgroup label="Head &#8212; Forehead &amp; Temple">
          <option value="M|forehead|forehead_central|face">Forehead &#8212; central (Area M)</option>
          <option value="M|forehead|forehead_lateral|face">Forehead &#8212; lateral (Area M)</option>
          <option value="H|face_central|temple|face">Temple (Area H)</option>
        </optgroup>
        <optgroup label="Head &#8212; Eyes">
          <option value="H|eyelid|upper_eyelid|face">Eyelid &#8212; upper (Area H)</option>
          <option value="H|eyelid|lower_eyelid|face">Eyelid &#8212; lower (Area H)</option>
          <option value="H|eyelid|medial_canthus|face">Medial canthus (Area H)</option>
          <option value="H|eyelid|lateral_canthus|face">Lateral canthus (Area H)</option>
          <option value="H|eyelid|periorbital|face">Periorbital &#8212; general (Area H)</option>
        </optgroup>
        <optgroup label="Head &#8212; Nose">
          <option value="H|nose|nose_tip|face">Nose &#8212; tip (Area H)</option>
          <option value="H|nose|nose_ala|face">Nose &#8212; ala (Area H)</option>
          <option value="H|nose|nose_dorsum|face">Nose &#8212; dorsum (Area H)</option>
          <option value="H|nose|nose_sidewall|face">Nose &#8212; sidewall (Area H)</option>
          <option value="H|nose|nose_columella|face">Nose &#8212; columella (Area H)</option>
          <option value="H|nose|nasal_sill|face">Nose &#8212; nasal sill (Area H)</option>
        </optgroup>
        <optgroup label="Head &#8212; Cheeks &amp; Midface">
          <option value="M|face_m|cheek|face">Cheek (Area M)</option>
          <option value="H|face_central|nasolabial_fold|face">Nasolabial fold (Area H)</option>
          <option value="H|face_central|perioral|face">Perioral &#8212; general (Area H)</option>
        </optgroup>
        <optgroup label="Head &#8212; Lips">
          <option value="H|lip|upper_lip|face">Lip &#8212; upper (Area H)</option>
          <option value="H|lip|lower_lip|face">Lip &#8212; lower (Area H)</option>
          <option value="H|lip|philtrum|face">Philtrum (Area H)</option>
          <option value="H|lip|commissure|face">Lip commissure (Area H)</option>
        </optgroup>
        <optgroup label="Head &#8212; Chin &amp; Jaw">
          <option value="M|face_m|chin|face">Chin (Area M)</option>
          <option value="M|face_m|jawline|face">Jawline (Area M)</option>
        </optgroup>
        <optgroup label="Head &#8212; Ears">
          <option value="H|ear|helix|face">Ear &#8212; helix (Area H)</option>
          <option value="H|ear|antihelix|face">Ear &#8212; antihelix (Area H)</option>
          <option value="H|ear|concha|face">Ear &#8212; concha (Area H)</option>
          <option value="H|ear|tragus|face">Ear &#8212; tragus (Area H)</option>
          <option value="H|ear|lobule|face">Ear &#8212; lobule (Area H)</option>
          <option value="H|ear|preauricular|face">Preauricular skin (Area H)</option>
          <option value="H|ear|postauricular|face">Postauricular skin (Area H)</option>
        </optgroup>
        <optgroup label="Neck">
          <option value="M|neck|anterior_neck|neck">Neck &#8212; anterior (Area M)</option>
          <option value="M|neck|posterior_neck|neck">Neck &#8212; posterior (Area M)</option>
          <option value="M|neck|lateral_neck|neck">Neck &#8212; lateral (Area M)</option>
        </optgroup>
        <optgroup label="Trunk">
          <option value="L|trunk|chest|trunk">Chest (Area L)</option>
          <option value="L|trunk|abdomen|trunk">Abdomen (Area L)</option>
          <option value="L|trunk|back_upper|trunk">Back &#8212; upper (Area L)</option>
          <option value="L|trunk|back_lower|trunk">Back &#8212; lower (Area L)</option>
          <option value="L|trunk|flank|trunk">Flank (Area L)</option>
          <option value="L|trunk|buttock|trunk">Buttock (Area L)</option>
        </optgroup>
        <optgroup label="Upper Extremity">
          <option value="L|shoulder|shoulder|trunk">Shoulder (Area L)</option>
          <option value="L|axilla|axilla|trunk">Axilla (Area L)</option>
          <option value="L|upper_arm|upper_arm|trunk">Upper arm (Area L)</option>
          <option value="L|forearm|forearm|trunk">Forearm (Area L)</option>
          <option value="L|elbow|elbow|trunk">Elbow (Area L)</option>
          <option value="L|wrist|wrist|trunk">Wrist (Area L)</option>
          <option value="M|hand|dorsal_hand|neck">Hand &#8212; dorsal (Area M)</option>
          <option value="M|hand|palmar_hand|neck">Hand &#8212; palmar (Area M)</option>
          <option value="M|hand|finger|neck">Finger / thumb (Area M)</option>
        </optgroup>
        <optgroup label="Lower Extremity">
          <option value="L|thigh|thigh|trunk">Thigh (Area L)</option>
          <option value="L|knee|knee|trunk">Knee (Area L)</option>
          <option value="L|lower_leg|lower_leg|trunk">Lower leg / shin (Area L)</option>
          <option value="L|calf|calf|trunk">Calf (Area L)</option>
          <option value="L|ankle|ankle|neck">Ankle (Area L)</option>
          <option value="M|foot|dorsal_foot|neck">Foot &#8212; dorsal (Area M)</option>
          <option value="M|foot|plantar_foot|neck">Foot &#8212; plantar (Area M)</option>
          <option value="M|foot|toe|neck">Toe (Area M)</option>
        </optgroup>
        <optgroup label="Other">
          <option value="M|genitalia|genitalia|neck">Genitalia / perineum (Area M)</option>
        </optgroup>
      </select>
      <div class="loc-tag" id="loc-tag"></div>
    </div>
  </div>
</div>

<!-- MEASUREMENTS -->
<div class="fg">
  <div class="fgt">Measurements</div>
  <div class="fr">
    <div class="f">
      <label for="diameter">Clinical lesion diameter <span class="req">*</span></label>
      <div class="iu">
        <input type="number" id="diameter" placeholder="0.0" min="0" step="0.1" style="flex:1">
        <span>cm</span>
      </div>
    </div>
    <div class="f">
      <label for="margin">Clinical margin <span class="req">*</span></label>
      <div class="iu">
        <input type="number" id="margin" placeholder="0.0" min="0" step="0.1" style="flex:1">
        <span>cm</span>
      </div>
    </div>
  </div>
</div>

<div class="calc-box" id="calc-box"></div>
<div class="err-box" id="err-box"></div>
<button class="go-btn" id="go-btn">&#8594; GENERATE CPT CODES</button>
<p class="hint">Results are estimates &mdash; verify all codes prior to billing.</p>
</div>

<div id="out" style="display:none"></div>
</div>

<script>
(function(){

function r2(n){return Math.round(n*100)/100;}

// ── Diagnosis dropdown tag ────────────────────────────────────────────────
document.getElementById('diagnosis').addEventListener('change',function(){
  var val=this.value, tag=document.getElementById('diag-tag');
  if(!val){tag.style.display='none';return;}
  var dt=val.split('|')[0];
  var mal=isMalignant(dt);
  tag.textContent=mal?'MALIGNANT':'BENIGN';
  tag.style.display='inline-block';
  tag.style.background=mal?'#fce8e8':'#d6ede0';
  tag.style.color=mal?'#7a1f1f':'#1a4d2e';
  tag.style.borderColor=mal?'#e5a0a0':'#8fcfaa';
});

// ── Location dropdown tag ────────────────────────────────────────────────
document.getElementById('location').addEventListener('change',function(){
  var val=this.value, tag=document.getElementById('loc-tag');
  if(!val){tag.style.display='none';return;}
  var area=val.split('|')[0];
  var lbl=area==='H'?'Area H — High-risk':area==='M'?'Area M — Medium-risk':'Area L — Low-risk';
  tag.textContent=lbl; tag.style.display='inline-block';
  tag.style.background=area==='H'?'#fce8e8':area==='M'?'#fdf0d5':'#d6ede0';
  tag.style.color=area==='H'?'#7a1f1f':area==='M'?'#7a4f00':'#1a4d2e';
  tag.style.borderColor=area==='H'?'#e5a0a0':area==='M'?'#f0d070':'#8fcfaa';
  updateCalc();
});

document.getElementById('diameter').addEventListener('input',updateCalc);
document.getElementById('margin').addEventListener('input',updateCalc);
function updateCalc(){
  var d=parseFloat(document.getElementById('diameter').value);
  var m=parseFloat(document.getElementById('margin').value);
  var el=document.getElementById('calc-box');
  if(!isNaN(d)&&d>0&&!isNaN(m)&&m>=0){
    var exc=r2(d+2*m),rep=r2(3*exc);
    el.innerHTML='<strong>Excision length:</strong> '+exc.toFixed(1)+' cm    <strong>Repair length:</strong> '+rep.toFixed(1)+' cm';
    el.classList.add('show');
  } else {el.classList.remove('show');}
}

function parseDiag(val){
  if(!val)return null;
  var p=val.split('|');
  return{dt:p[0],sub:p[1]||''};
}
function parseLoc(val){
  if(!val)return null;
  var p=val.split('|');
  var sel=document.getElementById('location');
  return{area:p[0],sub:p[1],subsub:p[2],rg:p[3],label:sel.options[sel.selectedIndex].text.replace(/\s*\(Area [HML]\)/,'').trim()};
}

// ── Submit ────────────────────────────────────────────────────────────────
document.getElementById('go-btn').addEventListener('click',function(){
  var err=document.getElementById('err-box'); err.style.display='none';
  var diagVal  =document.getElementById('diagnosis').value;
  var locVal   =document.getElementById('location').value;
  var diameter =parseFloat(document.getElementById('diameter').value);
  var margin   =parseFloat(document.getElementById('margin').value);
  var pr       =document.getElementById('pr').value;
  var ic       =document.getElementById('ic').value;

  // ── Validation ────────────────────────────────────────────────────────
  var errors=[];
  if(!diagVal)  errors.push('Please select a diagnosis.');
  if(!locVal)   errors.push('Please select a lesion location.');
  if(isNaN(diameter)||diameter<=0) errors.push('Please enter a valid lesion diameter (must be > 0).');
  if(isNaN(margin)||margin<0)      errors.push('Please enter a valid clinical margin (0 or greater).');
  if(diameter>30) errors.push('Lesion diameter of '+diameter+' cm seems unusually large. Please verify and re-enter.');
  if(margin>5)    errors.push('Clinical margin of '+margin+' cm seems unusually large. Please verify and re-enter.');
  if(!isNaN(diameter)&&!isNaN(margin)&&diameter>0&&margin>=0){
    var exc=r2(diameter+2*margin);
    // Check excision/repair make sense
    if(exc>40) errors.push('Calculated excision size of '+exc.toFixed(1)+' cm is outside expected range. Please check your inputs.');
  }
  if(errors.length){
    err.innerHTML=errors.join('<br>');
    err.style.display='block';
    return;
  }

  var diag=parseDiag(diagVal);
  var loc=parseLoc(locVal);
  var excisionSize=r2(diameter+2*margin);
  var repairLength=r2(3*excisionSize);
  var diagType=diag.dt;
  var subtype=diag.sub;
  var mal=isMalignant(diagType);
  var area=loc.area;
  var areaLbl=area==='H'?'Area H (high-risk)':area==='M'?'Area M (medium-risk)':'Area L (low-risk)';

  // ── Combinatorial validation ──────────────────────────────────────────
  // Flag unusual combinations that might indicate input error
  var warnings=[];
  // Benign + very large margin
  if(!mal&&margin>1.0) warnings.push('Note: margin of '+margin+' cm is larger than typical for a benign lesion. Verify this is correct.');
  // Melanoma on Area L with a very small margin for invasive disease
  if(diagType==='MELANOMA_INV'&&margin<0.9) warnings.push('Note: invasive melanoma typically requires ≥1cm margins. Final margin will depend on Breslow thickness.');

  render({
    diagLabel:document.getElementById('diagnosis').options[document.getElementById('diagnosis').selectedIndex].text,
    locLabel:loc.label,diameter:diameter,margin:margin,
    subtype:subtype,pr:pr,ic:ic,warnings:warnings,
    excisionSize:excisionSize,repairLength:repairLength,
    diagType:diagType,mal:mal,area:area,areaLbl:areaLbl,
    icd10:getICD10(diagType,loc),
    excision:getExcision(mal,area,excisionSize),
    repair:getRepair(area,loc.rg,repairLength),
    dest:getDest(mal,area,diameter),
    mohs:getMohs(diagType,subtype,pr,area,diameter,ic),
    mohsCPT:getMohsCPT(area),
    marginG:getMarginG(diagType,subtype,pr,area,diameter,margin),
    slnb:getSLNB(diagType,subtype,diameter)
  });
});

// ── Malignancy helper ─────────────────────────────────────────────────────
function isMalignant(dt){
  return['BCC','SCC','LM_MIS','MELANOMA_INV','DFSP','MCC','MAC','SEBACEOUS_CA','EMPD','AFX',
    'LEIOMYOSARCOMA','KERATOACANTHOMA','SPINDLE_CELL','ECCRINE_APOCRINE','TRICHILEMMAL',
    'MUCINOUS_CA','OTHER_MAL'].indexOf(dt)>=0;
}

  DFSP:{note:'Mohs surgery is the preferred treatment for DFSP at any location due to subclinical extension and high recurrence rates with standard excision (up to 50%). Not formally in the AAD/AUC table.',action:'Refer to Mohs surgery.'},

  EMPD:{note:'Mohs surgery is the preferred treatment for EMPD due to clinically indistinct borders and high recurrence with standard excision. Not in the AAD/AUC table.',action:'Refer to Mohs surgery.'},

  ECCRINE_APOCRINE:{note:'Mohs surgery is preferred for eccrine/apocrine carcinomas due to subclinical spread. Not in the AAD/AUC table.',action:'Refer to Mohs surgery.'},

// ── ICD-10 ────────────────────────────────────────────────────────────────
function getICD10(dt,loc){
  var area=loc.area,rg=loc.rg,sub=loc.sub||'';
  var isEar =['helix','antihelix','concha','tragus','lobule','preauricular','postauricular'].indexOf(sub)>=0;
  var isScalp=['scalp_vertex','scalp_frontal','scalp_parietal','scalp_occipital','scalp_temporal'].indexOf(sub)>=0;
  var isHand =['dorsal_hand','palmar_hand','finger'].indexOf(sub)>=0;
  var isFoot =['dorsal_foot','plantar_foot','toe'].indexOf(sub)>=0;
  var isUE   =['shoulder','upper_arm','forearm','elbow','wrist','axilla'].indexOf(sub)>=0;
  var isLE   =['thigh','knee','lower_leg','calf','ankle'].indexOf(sub)>=0;

  if(dt==='BCC'){
    if(area==='H') return isEar?{c:'C44.219',d:'BCC of skin of ear and external auricular canal'}:{c:'C44.319',d:'BCC of skin of face'};
    if(area==='M'){
      if(isScalp||rg==='neck')return{c:'C44.41',d:'BCC of skin of scalp and neck'};
      if(isHand)return{c:'C44.619',d:'BCC of skin of upper limb'};
      if(isFoot)return{c:'C44.719',d:'BCC of skin of lower limb'};
      return{c:'C44.319',d:'BCC of skin of face'};
    }
    if(rg==='trunk')return{c:'C44.519',d:'BCC of skin of trunk'};
    if(isUE||sub==='shoulder')return{c:'C44.619',d:'BCC of skin of upper limb'};
    return{c:'C44.719',d:'BCC of skin of lower limb'};
  }
  if(dt==='SCC'){
    if(area==='H') return isEar?{c:'C44.229',d:'SCC of skin of ear and external auricular canal'}:{c:'C44.329',d:'SCC of skin of face'};
    if(area==='M'){
      if(isScalp||rg==='neck')return{c:'C44.42',d:'SCC of skin of scalp and neck'};
      if(isHand)return{c:'C44.629',d:'SCC of skin of upper limb'};
      if(isFoot)return{c:'C44.729',d:'SCC of skin of lower limb'};
      return{c:'C44.329',d:'SCC of skin of face'};
    }
    if(rg==='trunk')return{c:'C44.529',d:'SCC of skin of trunk'};
    if(isUE||sub==='shoulder')return{c:'C44.629',d:'SCC of skin of upper limb'};
    return{c:'C44.729',d:'SCC of skin of lower limb'};
  }
  if(dt==='LM_MIS'){
    if(area==='H')return{c:'D03.39',d:'Melanoma in situ of face'};
    if(area==='M'){
      if(isScalp||rg==='neck')return{c:'D03.4',d:'Melanoma in situ of scalp and neck'};
      return{c:'D03.39',d:'Melanoma in situ of face'};
    }
    if(rg==='trunk')return{c:'D03.59',d:'Melanoma in situ of trunk'};
    if(isUE||sub==='shoulder')return{c:'D03.69',d:'Melanoma in situ of upper limb'};
    return{c:'D03.79',d:'Melanoma in situ of lower limb'};
  }
  if(dt==='MELANOMA_INV')return{c:'C43.9',d:'Malignant melanoma of skin, unspecified'};
  if(dt==='MCC')return{c:'C4A.9',d:'Merkel cell carcinoma, unspecified'};
  if(dt==='DFSP')return{c:'C49.9',d:'DFSP / malignant neoplasm of connective tissue'};
  if(dt==='AFX')return{c:'C44.99',d:'Other malignant neoplasm of skin (AFX)'};
  if(dt==='EMPD')return{c:'C44.590',d:'Other specified malignant neoplasm of skin (EMPD)'};
  if(dt==='MAC')return{c:'C44.99',d:'Malignant neoplasm of skin (MAC) — verify site-specific code'};
  if(dt==='SEBACEOUS_CA')return{c:'C44.99',d:'Sebaceous carcinoma — verify site-specific code'};
  if(dt==='LEIOMYOSARCOMA')return{c:'C49.9',d:'Leiomyosarcoma of soft tissue'};
  if(dt==='KERATOACANTHOMA')return{c:'L85.8',d:'Keratoacanthoma'};
  if(dt==='SPINDLE_CELL')return{c:'C44.99',d:'Spindle cell tumor — verify subtype code'};
  if(dt==='ECCRINE_APOCRINE')return{c:'C44.99',d:'Eccrine/apocrine carcinoma — verify site-specific code'};
  if(dt==='TRICHILEMMAL')return{c:'C44.99',d:'Trichilemmal carcinoma — verify site-specific code'};
  if(dt==='MUCINOUS_CA')return{c:'C44.99',d:'Mucinous carcinoma of skin — verify site-specific code'};
  if(dt==='OTHER_MAL')return{c:'C44.99',d:'Other malignant neoplasm of skin — verify specific ICD-10 code'};
  if(dt==='OTHER_BENIGN')return{c:'L98.9',d:'Other disorder of skin — verify specific ICD-10 code'};
  return{c:'L98.9',d:'Disorder of skin, unspecified (benign — specify)'};
}

// ── Excision CPT ──────────────────────────────────────────────────────────
function getExcision(mal,area,size){
  var base=mal?(area==='H'?11640:area==='M'?11620:11600):(area==='H'?11440:area==='M'?11420:11400);
  var grp=area==='H'?'face/ears/eyelids/nose/lips':area==='M'?'scalp/neck/hands/feet':'trunk/extremities';
  var off,sd;
  if(size<=0.5){off=0;sd='≤0.5 cm';}
  else if(size<=1.0){off=1;sd='0.6–1.0 cm';}
  else if(size<=2.0){off=2;sd='1.1–2.0 cm';}
  else if(size<=3.0){off=3;sd='2.1–3.0 cm';}
  else if(size<=4.0){off=4;sd='3.1–4.0 cm';}
  else if(size<=5.0){off=5;sd='4.1–5.0 cm';}
  else{off=6;sd='>5.0 cm';}
  return{c:String(base+off),d:'Excision, '+(mal?'malignant':'benign')+' lesion, '+grp+', '+sd};
}

// Intermediate:

  trunk:[{x:2.5,c:'12031',d:'Intermediate repair, scalp/trunk/extremities, ≤2.5 cm'},{x:7.5,c:'12032',d:'Intermediate repair, scalp/trunk/extremities, 2.6–7.5 cm'},{x:12.5,c:'12034',d:'Intermediate repair, scalp/trunk/extremities, 7.6–12.5 cm'},{x:20.0,c:'12035',d:'Intermediate repair, scalp/trunk/extremities, 12.6–20.0 cm'},{x:30.0,c:'12036',d:'Intermediate repair, scalp/trunk/extremities, 20.1–30.0 cm'},{x:Infinity,c:'12037',d:'Intermediate repair, scalp/trunk/extremities, >30.0 cm'}]
};
var CG={
  face:[{x:1.0,c:'13150',d:'Complex repair, eyelids/nose/ears/lips, ≤1.0 cm'},{x:2.5,c:'13151',d:'Complex repair, eyelids/nose/ears/lips, 1.1–2.5 cm'},{x:7.5,c:'13152',d:'Complex repair, eyelids/nose/ears/lips, 2.6–7.5 cm'},{x:Infinity,c:'13153',d:'Complex repair, eyelids/nose/ears/lips, >7.5 cm (+add-on 13153)'}],
  neck:[{x:1.1,c:'13120',d:'Complex repair, forehead/cheeks/chin/neck/hands/feet, ≤1.1 cm'},{x:7.5,c:'13121',d:'Complex repair, forehead/cheeks/chin/neck/hands/feet, 2.6–7.5 cm'},{x:Infinity,c:'13122',d:'Complex repair, forehead/cheeks/chin/neck/hands/feet, >7.5 cm (+add-on 13122)'}],
  scalp:[{x:1.1,c:'13100',d:'Complex repair, scalp/trunk/extremities, ≤1.1 cm'},{x:7.5,c:'13101',d:'Complex repair, scalp/trunk/extremities, 2.6–7.5 cm'},{x:Infinity,c:'13102',d:'Complex repair, scalp/trunk/extremities, >7.5 cm (+add-on 13102)'}]
};
function fi(g,v){for(var i=0;i<g.length;i++)if(v<=g[i].x)return{e:g[i],i:i};return{e:g[g.length-1],i:g.length-1};}

function getRepair(area,rg,rl){
  var ig=(area==='H')?IG.face:(rg==='neck')?IG.neck:IG.trunk;
  var cg;
  if(area==='H')cg=CG.face;
  else if(rg==='neck'||rg==='face')cg=CG.neck;
  else cg=CG.scalp;
  var ir=fi(ig,rl),cr=fi(cg,rl);
  return{int:ir.e,intUp:ir.i+1<ig.length?ig[ir.i+1]:null,cx:cr.e,cxUp:cr.i+1<cg.length?cg[cr.i+1]:null};
}

// ── Destruction CPT ───────────────────────────────────────────────────────
function getDest(mal,area,size){
  if(!mal)return{c:'17000 / 17110',d:'Destruction benign/premalignant lesion (17000=first lesion; 17110=up to 14 lesions)'};
  var base=area==='H'?17280:area==='M'?17270:17260;
  var grp=area==='H'?'face/ears/eyelids/nose/lips':area==='M'?'scalp/neck/hands/feet/genitalia':'trunk/extremities';
  var off,sd;
  if(size<=0.5){off=0;sd='≤0.5 cm';}else if(size<=1.0){off=1;sd='0.6–1.0 cm';}else if(size<=2.0){off=2;sd='1.1–2.0 cm';}else if(size<=3.0){off=3;sd='2.1–3.0 cm';}else if(size<=4.0){off=4;sd='3.1–4.0 cm';}else{off=5;sd='>4.0 cm';}
  return{c:String(base+off),d:'Destruction malignant lesion, '+grp+', '+sd};
}

// ── Mohs CPT ──────────────────────────────────────────────────────────────
function getMohsCPT(area){
  return(area==='H'||area==='M')
    ?{first:{c:'17311',d:'Mohs surgery, head/neck/hands/feet/genitalia — first stage, up to 5 tissue blocks'},addon:{c:'17312',d:'Mohs surgery, head/neck/hands/feet/genitalia — each additional stage (add-on)'}}
    :{first:{c:'17313',d:'Mohs surgery, trunk/extremities — first stage, up to 5 tissue blocks'},addon:{c:'17314',d:'Mohs surgery, trunk/extremities — each additional stage (add-on)'}};
}

// ── Mohs AUC ──────────────────────────────────────────────────────────────
function getMohs(dt,sub,pr,area,diam,ic){
  var d=parseFloat(diam),isIC=ic==='yes',s=sub||'';
  if(LIT[dt])return{res:'lit',note:LIT[dt].note,action:LIT[dt].action};
  if(dt==='MELANOMA_INV')return{res:'unk',note:'Invasive melanoma is not typically treated with Mohs surgery. Wide local excision with SLNB is standard of care.',action:'Standard wide local excision; refer to surgical oncology as appropriate.'};
  if(dt==='OTHER_MAL')return{res:'unk',note:'Mohs AUC not available for unspecified malignant lesion. Refer to appropriate specialist.',action:'Verify diagnosis and consult as appropriate.'};
  if(dt==='BENIGN'||dt==='OTHER_BENIGN')return{res:'unk',note:'Mohs surgery is not indicated for benign lesions.',action:''};
  if(dt!=='BCC'&&dt!=='SCC'&&dt!=='LM_MIS')return{res:'unk',note:'Mohs AUC applies to BCC, SCC, and LM/MIS.',action:''};

  if(dt==='LM_MIS'){
    if(area==='H'||area==='M')return{res:'ok',note:'LM/MIS on Area H or M.',action:'Consider referral to Mohs surgery.'};
    if(pr==='recurrent')return{res:'ok',note:'Recurrent LM/MIS on Area L.',action:'Consider referral to Mohs surgery.'};
    return{res:'unc',note:'Primary LM/MIS on Area L.',action:'Clinical judgment required; consider Mohs if additional risk factors present.'};
  }
  if(dt==='BCC'){
    var ag=s==='bcc_aggressive',no=s==='bcc_nodular',su=s==='bcc_superficial';
    if(area==='H')return{res:'ok',note:'All BCC subtypes on Area H.',action:'Consider referral to Mohs surgery.'};
    if(area==='M'){
      if(pr==='recurrent')return{res:'ok',note:'Recurrent BCC on Area M.',action:'Consider referral to Mohs surgery.'};
      if(ag||no)return{res:'ok',note:'Primary aggressive or nodular BCC on Area M.',action:'Consider referral to Mohs surgery.'};
      if(su&&d>=0.6)return{res:'ok',note:'Primary superficial BCC ≥0.6 cm on Area M.',action:'Consider referral to Mohs surgery.'};
      if(su&&d<0.6)return{res:'unc',note:'Primary superficial BCC ≤0.5 cm on Area M.',action:'Clinical judgment required.'};
      return{res:'unc',note:'Primary BCC on Area M — specify subtype to confirm.',action:'Specify subtype for definitive AUC.'};
    }
    if(pr==='recurrent'){
      if(su)return{res:'no',note:'Recurrent superficial BCC on Area L.',action:'Standard excision preferred.'};
      if(no&&d<=1.0)return{res:'no',note:'Recurrent nodular BCC ≤1 cm on Area L.',action:'Standard excision preferred.'};
      if(ag||(no&&d>1.0))return{res:'ok',note:'Recurrent aggressive/large nodular BCC on Area L.',action:'Consider referral to Mohs surgery.'};
      return{res:'unc',note:'Recurrent BCC on Area L — specify subtype.',action:'Clinical judgment required.'};
    }
    if(ag&&d>=0.6)return{res:'ok',note:'Primary aggressive BCC ≥0.6 cm on Area L.',action:'Consider referral to Mohs surgery.'};
    if(no&&d>2.0)return{res:'ok',note:'Primary nodular BCC >2 cm on Area L.',action:'Consider referral to Mohs surgery.'};
    if(no&&d>=1.1&&d<=2.0)return{res:'unc',note:'Primary nodular BCC 1.1–2 cm on Area L.',action:'Clinical judgment required.'};
    if(isIC&&no&&d>=0.6&&d<=1.0)return{res:'unc',note:'Primary nodular BCC (IC) 0.6–1 cm on Area L.',action:'Clinical judgment required.'};
    if(isIC&&su&&d>=1.1)return{res:'unc',note:'Primary superficial BCC (IC) ≥1.1 cm on Area L.',action:'Clinical judgment required.'};
    if(ag&&d<=0.5)return{res:'unc',note:'Primary aggressive BCC ≤0.5 cm on Area L.',action:'Clinical judgment required.'};
    if((no&&d<=1.0)||su)return{res:'no',note:'Primary nodular/superficial BCC ≤1 cm on Area L.',action:'Standard excision preferred.'};
    return{res:'unc',note:'Primary BCC on Area L — verify subtype.',action:'Clinical judgment required.'};
  }
  if(dt==='SCC'){
    var ag2=s==='scc_aggressive',na=s==='scc_nonaggressive',ka=s==='scc_katype',sc=s==='scc_sccis_bowen',ak=s==='scc_ak_focal_sccis';
    if(area==='H'){if(ak)return{res:'unc',note:'AK with focal SCCIS on Area H.',action:'Clinical judgment required.'};return{res:'ok',note:'SCC on Area H.',action:'Consider referral to Mohs surgery.'};}
    if(area==='M'){if(ak)return{res:'unc',note:'AK with focal SCCIS on Area M.',action:'Clinical judgment required.'};return{res:'ok',note:'SCC on Area M.',action:'Consider referral to Mohs surgery.'};}
    if(pr==='recurrent'){
      if(ak)return{res:'no',note:'Recurrent AK with focal SCCIS on Area L.',action:'Standard excision preferred.'};
      if(ag2||ka)return{res:'ok',note:'Recurrent aggressive or KA-type SCC on Area L.',action:'Consider referral to Mohs surgery.'};
      if(na)return{res:'ok',note:'Recurrent nonaggressive SCC on Area L.',action:'Consider referral to Mohs surgery.'};
      if(sc)return{res:'unc',note:'Recurrent SCCIS/Bowen on Area L.',action:'Clinical judgment required.'};
      return{res:'unc',note:'Recurrent SCC on Area L — specify subtype.',action:'Clinical judgment required.'};
    }
    if(ag2)return{res:'ok',note:'Primary aggressive SCC on Area L.',action:'Consider referral to Mohs surgery.'};
    if(ka&&d>=0.6)return{res:'ok',note:'Primary KA-type SCC ≥0.6 cm on Area L.',action:'Consider referral to Mohs surgery.'};
    if(na&&d>2.0)return{res:'ok',note:'Primary nonaggressive SCC >2 cm on Area L.',action:'Consider referral to Mohs surgery.'};
    if(sc&&d>2.0)return{res:'ok',note:'Primary SCCIS/Bowen >2 cm on Area L.',action:'Consider referral to Mohs surgery.'};
    if(na&&d>=1.1&&d<=2.0)return{res:'unc',note:'Primary nonaggressive SCC 1.1–2 cm on Area L.',action:'Clinical judgment required.'};
    if(sc&&d>=1.1&&d<=2.0)return{res:'unc',note:'Primary SCCIS/Bowen 1.1–2 cm on Area L.',action:'Clinical judgment required.'};
    if(isIC&&na&&d>=1.0)return{res:'unc',note:'Primary nonaggressive SCC (IC) ≥1 cm on Area L.',action:'Clinical judgment required.'};
    if(isIC&&sc&&d>=0.6)return{res:'unc',note:'Primary SCCIS/Bowen (IC) ≥0.6 cm on Area L.',action:'Clinical judgment required.'};
    if(isIC&&ka&&d>=0.6)return{res:'unc',note:'Primary KA-type SCC (IC) ≥0.6 cm on Area L.',action:'Clinical judgment required.'};
    if(ak)return{res:'no',note:'Primary AK with focal SCCIS on Area L.',action:'Standard excision preferred.'};
    if((na&&d<=1.0)||(sc&&d<=1.0))return{res:'no',note:'Primary nonaggressive SCC or SCCIS ≤1 cm on Area L.',action:'Standard excision preferred.'};
    return{res:'unc',note:'Primary SCC on Area L — specify subtype.',action:'Clinical judgment required.'};
  }
  return{res:'unk',note:'Cannot determine Mohs AUC for this diagnosis.',action:''};
}

// ── Margin guidance ───────────────────────────────────────────────────────
function getMarginG(dt,sub,pr,area,diam,em){
  var d=parseFloat(diam),e=parseFloat(em),s=sub||'';
  if(dt==='BCC'){
    var mc=s==='bcc_aggressive'||pr==='recurrent'||area==='H'||area==='M';
    if(mc)return{rec:'N/A — Mohs preferred',flag:'na',note:'Margin determined intraoperatively with Mohs surgery. Standard excision margins not applicable for this presentation.',src:'NCCN Guidelines'};
    return{rec:'4 mm (0.4 cm)',flag:e<0.4?'low':'ok',
      note:e<0.4?'Entered margin is below the 4mm guideline recommendation. Brodland & Zitelli (JAAD 1992) demonstrated 4mm margins achieve >95% clearance for low-risk BCC.':'4mm margins achieve >95% clearance for low-risk BCC (Brodland & Zitelli, JAAD 1992; NCCN Guidelines).',
      src:'Brodland & Zitelli, JAAD 1992; NCCN BCC Guidelines'};
  }
  if(dt==='SCC'){
    if(area==='H'||area==='M')return{rec:'N/A — Mohs preferred',flag:'na',note:'Margin determined intraoperatively with Mohs surgery for SCC on Area H or M.',src:'NCCN Guidelines'};
    var hi=s==='scc_aggressive'||d>=2.0||pr==='recurrent';
    if(hi)return{rec:'6 mm (0.6 cm)',flag:e<0.6?'low':'ok',
      note:e<0.6?'Entered margin is below the 6mm recommendation for high-risk SCC.':'6mm margins recommended for high-risk SCC (Brodland & Zitelli, JAAD 1992; NCCN SCC Guidelines).',
      src:'Brodland & Zitelli, JAAD 1992; NCCN SCC Guidelines'};
    return{rec:'4–6 mm (0.4–0.6 cm)',flag:e<0.4?'low':'ok',
      note:e<0.4?'Entered margin appears below the 4–6mm recommendation for low-risk SCC.':'4mm for low-risk SCC; 6mm for high-risk features.',
      src:'Brodland & Zitelli, JAAD 1992; NCCN SCC Guidelines'};
  }
  if(dt==='LM_MIS'){
    var isLM=s==='lm'||s==='';
    if(isLM)return{rec:'9–10 mm for LM; 5 mm for non-LM MIS',flag:e<0.5?'low':e<0.9?'inf':'ok',
      note:e<0.5?'Entered margin is below even the minimum recommendation. 5mm margins are inadequate for lentigo maligna in 20–50% of cases. Mohs or staged excision with en face margin assessment is strongly preferred (Hazan et al., JAAD 2021).':
           e<0.9?'For lentigo maligna, 5mm margins are inadequate in 20–50% of cases. 9–10mm margins proposed (Hazan et al., JAAD 2021). Mohs or staged excision strongly preferred.':
                 'Margin appears adequate. For LM, Mohs or staged excision with en face margin assessment is preferred regardless of margin width.',
      src:'NCCN Guidelines; Hazan et al., JAAD 2021; Johnson et al., Dermatol Surg 2020'};
    return{rec:'5 mm (0.5 cm)',flag:e<0.5?'low':'ok',
      note:e<0.5?'Entered margin is below the 5mm NCCN recommendation for non-LM MIS.':'5mm margins per NCCN for non-LM melanoma in situ.',
      src:'NCCN Melanoma Guidelines'};
  }
  if(dt==='MELANOMA_INV')return{rec:'1cm (≤1mm Breslow) · 1–2cm (1–2mm) · 2cm (>2mm)',flag:'inf',
    note:'Margin determined by Breslow thickness, not yet available at consultation. Tiers: ≤1.0mm→1cm; 1.01–2.0mm→1–2cm; >2.0mm→2cm.',
    src:'NCCN Melanoma Guidelines; WHO Melanoma Program RCTs'};
  if(dt==='DFSP')return{rec:'2–3 cm if standard excision; Mohs preferred',flag:e<2.0?'low':'ok',
    note:e<2.0?'Standard excision of DFSP requires 2–3cm margins; narrower margins yield up to 50% recurrence. Mohs reduces recurrence to <2%.':'Standard excision requires 2–3cm margins; Mohs is preferred.',
    src:'Gloster, JAAD 1996; NCCN Soft Tissue Sarcoma Guidelines'};
  if(dt==='MCC')return{rec:'1–2 cm',flag:e<1.0?'low':'ok',
    note:'NCCN recommends 1–2cm margins for MCC. Mohs with complete margin assessment is preferred.',
    src:'NCCN MCC Guidelines'};
  var litSet=['MAC','AFX','EMPD','SEBACEOUS_CA','LEIOMYOSARCOMA','SPINDLE_CELL','ECCRINE_APOCRINE','TRICHILEMMAL','MUCINOUS_CA'];
  for(var i=0;i<litSet.length;i++)if(dt===litSet[i])return{rec:'1–2 cm if standard excision; Mohs preferred',flag:'na',
    note:'Mohs surgery is preferred; margin determined intraoperatively. If standard excision is performed, 1–2cm margins are generally recommended.',
    src:'Literature-supported; see diagnosis-specific references'};
  if(dt==='OTHER_MAL')return{rec:'Diagnosis-specific — verify guidelines',flag:'na',note:'Margin recommendations depend on specific diagnosis. Verify with appropriate clinical guidelines.',src:''};
  return{rec:'1–3 mm typical',flag:'na',note:'Standard margins for benign lesions vary by type; no strict guideline threshold applies.',src:''};
}

// ── SLNB ──────────────────────────────────────────────────────────────────
function getSLNB(dt,sub,diam){
  var d=parseFloat(diam),s=sub||'';
  if(dt==='MELANOMA_INV')return{lvl:'req',title:'SLNB — discuss at consultation',
    note:'SLNB is standard of care for melanoma ≥0.8mm Breslow thickness (NCCN Category 1). Breslow thickness not yet available — document that SLNB eligibility will be determined from final pathology.',
    src:'Morton et al., NEJM 2006 (MSLT-I); Faries et al., NEJM 2017 (MSLT-II); NCCN Melanoma Guidelines'};
  if(dt==='MCC')return{lvl:'req',title:'SLNB — recommended for all clinically N0 MCC',
    note:'SLNB recommended by NCCN (Category 2A) for all clinically node-negative MCC at any size. Occult nodal disease found in 26–36% of clinically N0 patients.',
    src:'Gupta et al., JAAD 2006; Allen et al., Ann Surg Oncol 2005; NCCN MCC Guidelines'};
  if(dt==='SCC'&&(s==='scc_aggressive'||d>=4.0))return{lvl:'con',title:'SLNB — consider for high-risk SCC',
    note:'SLNB may be considered (NCCN Category 2B) for high-risk SCC with diameter >4cm, perineural invasion, or poorly differentiated histology. Pooled sentinel node positivity ~14%.',
    src:'Navarrete-Dechent et al., JAAD 2019; NCCN SCC Guidelines'};
  if(dt==='DFSP')return{lvl:'ni',title:'SLNB — not routinely indicated for conventional DFSP',
    note:'Metastatic rate <5% for conventional DFSP; SLNB not routinely recommended. If fibrosarcomatous transformation suspected, nodal staging may be appropriate.',
    src:'Gloster, JAAD 1996; NCCN Soft Tissue Sarcoma Guidelines'};
  var mdt=['MAC','LEIOMYOSARCOMA','ECCRINE_APOCRINE','SEBACEOUS_CA','MUCINOUS_CA'];
  for(var i=0;i<mdt.length;i++)if(dt===mdt[i])return{lvl:'con',title:'SLNB — discuss in multidisciplinary context',
    note:'Regional metastasis rates are low but non-negligible. Nodal staging should be discussed in a multidisciplinary setting.',
    src:'Tumor-specific case series; multidisciplinary consensus'};
  return null;
}

// ── Render ────────────────────────────────────────────────────────────────
function render(r){
  var isLit=r.mohs.res==='lit';
  var bMap={ok:'b-ok',unc:'b-unc',no:'b-no',lit:'b-lit',unk:'b-unk'};
  var lMap={ok:'✓ APPROPRIATE FOR MOHS (AUC)',unc:'~ UNCERTAIN FOR MOHS (AUC)',no:'✗ INAPPROPRIATE FOR MOHS (AUC)',lit:'★ MOHS PREFERRED — LITERATURE SUPPORTED',unk:'— MOHS AUC NOT APPLICABLE'};
  var showM=r.mohs.res==='ok'||r.mohs.res==='unc'||r.mohs.res==='lit';

  var iSu=r.repair.intUp?'<span class="su">↑ step-up: '+r.repair.intUp.c+'</span>':'';
  var cSu=r.repair.cxUp ?'<span class="su">↑ step-up: '+r.repair.cxUp.c+'</span>':'';

  var mohsCpt=showM
    ?'<hr class="sdiv"><div class="sl2">Mohs CPT codes (if referred)</div><div class="cg" style="line-height:1.8"><div class="cr"><span class="cl">Mohs first stage:</span><span class="cv">'+r.mohsCPT.first.c+'</span></div><div class="cr"><span class="cl">Each additional stage (add-on):</span><span class="cv">'+r.mohsCPT.addon.c+'</span></div></div>'
    :'';

  var legM=showM?'<tr><td>'+r.mohsCPT.first.c+'</td><td>'+r.mohsCPT.first.d+'</td></tr><tr><td>'+r.mohsCPT.addon.c+'</td><td>'+r.mohsCPT.addon.d+'</td></tr>':'';
  var legIU=r.repair.intUp?'<tr><td>'+r.repair.intUp.c+'</td><td><em>Step-up intermediate:</em> '+r.repair.intUp.d+'</td></tr>':'';
  var legCU=r.repair.cxUp ?'<tr><td>'+r.repair.cxUp.c +'</td><td><em>Step-up complex:</em> '   +r.repair.cxUp.d +'</td></tr>':'';

  var flM={ok:'fl-ok',low:'fl-low',inf:'fl-inf'};
  var flL={ok:'WITHIN GUIDELINES',low:'BELOW GUIDELINE',inf:'NOTE'};
  var mFlag=r.marginG.flag!=='na'?'<span class="fl '+flM[r.marginG.flag]+'">'+flL[r.marginG.flag]+'</span>':'';

  var slHtml='';
  if(r.slnb){
    var sMap={req:'sl-req',con:'sl-con',ni:'sl-ni'};
    slHtml='<div class="slnb '+sMap[r.slnb.lvl]+'"><div class="sl-t">'+r.slnb.title+'</div><div>'+r.slnb.note+'</div><div class="sl-s">Source: '+r.slnb.src+'</div></div>';
  }

  var warnHtml='';
  if(r.warnings&&r.warnings.length){
    warnHtml='<div style="background:#fdf0d5;border:1px solid #f0d070;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#7a4f00;line-height:1.5">'
      +'<strong>Note:</strong> '+r.warnings.join('<br>')+'</div>';
  }

  var mohsBody='<div class="badge '+bMap[r.mohs.res]+'">'+lMap[r.mohs.res]+'</div>'
    +'<div class="mn">'+r.mohs.note+'</div>'
    +(r.mohs.action&&!isLit?'<div class="ma">'+r.mohs.action+'</div>':'')
    +(isLit?'<div class="lb">Not in the AAD/AUC table — Mohs surgery is the preferred treatment based on current literature. '+r.mohs.action+'</div>':'')
    +(!isLit&&r.mohs.res!=='unk'?'<div class="ml2">Location: <strong>'+r.areaLbl+'</strong> · '+(r.mal?'Malignant':'Benign')+'</div>':'')
    +slHtml;

  var html=
    '<div class="rh"><span>Billing Estimate</span><button class="new-btn" id="reset-btn">← New case</button></div>'
    +warnHtml
    +'<div class="card"><div class="ch">CPT / ICD-10 Codes</div><div class="cb">'
      +'<div class="cg">'
        +'<div class="cr"><span class="cl">Diagnosis:</span><span class="cv">'+r.diagLabel+'</span></div>'
        +'<div class="cr"><span class="cl">Location:</span><span class="cv">'+r.locLabel+' — '+r.areaLbl+'</span></div>'
        +'<div class="cr"><span class="cl">ICD-10 code:</span><span class="cv">'+r.icd10.c+'</span></div>'
        +'<div class="cr"><span class="cl">Excision length:</span><span class="cv">'+r.excisionSize.toFixed(1)+' cm</span></div>'
        +'<div class="cr"><span class="cl">Repair length:</span><span class="cv">'+r.repairLength.toFixed(1)+' cm</span></div>'
        +'<hr class="cdiv">'
        +'<div class="cr"><span class="cl">Excision + intermediate repair:</span><span class="cv">'+r.excision.c+', '+r.repair.int.c+'</span>'+iSu+'</div>'
        +'<div class="cr"><span class="cl">Excision + complex repair:</span><span class="cv">'+r.excision.c+', '+r.repair.cx.c+'</span>'+cSu+'</div>'
        +'<div class="cr"><span class="cl">Destruction (ED&amp;C):</span><span class="cv">'+r.dest.c+'</span></div>'
      +'</div>'+mohsCpt
    +'</div></div>'
    +'<div class="card"><div class="ch">Code Descriptions</div><div class="cb">'
      +'<table class="leg">'
        +'<tr><td>'+r.icd10.c+'</td><td>'+r.icd10.d+'</td></tr>'
        +'<tr><td>'+r.excision.c+'</td><td>'+r.excision.d+'</td></tr>'
        +'<tr><td>'+r.repair.int.c+'</td><td>'+r.repair.int.d+'</td></tr>'+legIU
        +'<tr><td>'+r.repair.cx.c+'</td><td>'+r.repair.cx.d+'</td></tr>'+legCU
        +'<tr><td>'+r.dest.c+'</td><td>'+r.dest.d+'</td></tr>'+legM
      +'</table>'
      +(r.repair.intUp||r.repair.cxUp?'<p class="nt">Step-up codes shown if repair ends up larger than estimated.</p>':'')
      +'<p class="nt" style="margin-top:6px">Verify all codes before billing. ICD-10 codes are approximate — confirm site-specific code per documentation.</p>'
    +'</div></div>'
    +'<div class="card"><div class="ch">Mohs AUC Assessment</div><div class="cb">'+mohsBody+'</div></div>'
    +'<div class="card"><div class="ch">Margin Guidance</div><div class="cb">'
      +'<div class="mr2"><span class="mla">Entered margin:</span><span class="mv">'+r.margin+' cm</span>'+mFlag+'</div>'
      +'<div class="mr2"><span class="mla">Guideline recommendation:</span><span class="mv">'+r.marginG.rec+'</span></div>'
      +'<p class="mno">'+r.marginG.note+'</p>'
      +(r.marginG.src?'<p class="msr">Source: '+r.marginG.src+'</p>':'')
    +'</div></div>';

  document.getElementById('form-section').style.display='none';
  var out=document.getElementById('out');
  out.innerHTML=html;
  out.style.display='block';
  document.getElementById('reset-btn').addEventListener('click',doReset);
}

})();
</script>
